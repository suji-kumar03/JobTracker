<header class="fixed
         top-0
         left-0
         right-0
         z-[100]
         h-20
         bg-slate-900
         text-white
         px-4
         sm:px-6
         flex
         items-center
         justify-between
         shadow-md">

  <!-- Logo and Menu -->
  <div class="flex items-center gap-3">

    <button
      mat-icon-button
      type="button"
      (click)="toggleSidebar()"
      matTooltip="Menu"
      matTooltipPosition="right"
      class="!text-white !w-11 !h-11 !p-0 !-ml-2
             hover:!bg-slate-800
             flex items-center justify-center">

      <mat-icon>menu</mat-icon>
    </button>

    <div class="flex items-center gap-3">

      <div class="w-10 h-10 bg-violet-600 rounded-xl
                  flex items-center justify-center
                  font-bold text-lg text-white">
        J
      </div>

      <span class="text-lg sm:text-xl font-bold text-white">
        JobTrack
      </span>

    </div>
  </div>

  <!-- Search, Notifications and Profile -->
  <div class="flex items-center gap-0 sm:gap-2 shrink-0">

    <!-- Admin Application Search -->
    <div class="flex items-center">

      @if (searchOpen()) {

        <mat-form-field
          appearance="outline"
          class="global-search-field w-36 sm:w-56 !mb-[-1.25em]">

          <mat-label>Search Applications</mat-label>

          <input
            matInput
            type="text"
            [ngModel]="globalSearch()"
            (ngModelChange)="globalSearch.set($event)"
            (keyup.enter)="searchApplications()"
            placeholder="Search applications...">

          <button
            mat-icon-button
            matSuffix
            type="button"
            matTooltip="Close Search"
            (click)="closeSearch()"
            class="!text-white">

            <mat-icon>close</mat-icon>
          </button>

        </mat-form-field>

      } @else {

        <button
          mat-icon-button
          type="button"
          matTooltip="Search Applications"
          matTooltipPosition="below"
          (click)="toggleSearch()"
          class="!text-white hover:!bg-slate-800">

          <mat-icon>search</mat-icon>
        </button>

      }

    </div>

    <button
      mat-icon-button
      type="button"
      matTooltip="Notifications"
      matTooltipPosition="below"
      class="!text-white hover:!bg-slate-800">

      <mat-icon>notifications</mat-icon>
    </button>

    <!-- Admin Profile -->
    <button
      type="button"
      [matMenuTriggerFor]="profileMenu"
      [matTooltip]="userName()"
      matTooltipPosition="below"
      class="w-10 h-10 shrink-0 rounded-full
             bg-violet-600
             flex items-center justify-center
             text-white font-bold text-lg
             hover:bg-violet-700 transition cursor-pointer">

      {{ userName().charAt(0).toUpperCase() || 'A' }}

    </button>

    <mat-menu #profileMenu="matMenu">

      <div class="px-4 py-2 text-sm text-slate-600">
        {{ userName() || 'Admin' }}
        <p class="text-xs text-slate-400">Administrator</p>
      </div>

      <button mat-menu-item type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>

    </mat-menu>

  </div>

</header>

<!-- Sidebar and Main Content -->
<div class="fixed
            top-20
            left-0
            right-0
            bottom-0
            flex
            bg-slate-50
            overflow-hidden">

  <!-- Collapsible Admin Sidebar -->
  <aside
    class="h-full
           bg-slate-900
           text-white
           shrink-0
           transition-all
           duration-300
           ease-in-out
           overflow-hidden"
    [class.w-[72px]]="!sidebarExpanded()"
    [class.w-60]="sidebarExpanded()">

    <nav class="p-3 space-y-2">

      <!-- Dashboard -->
      <a
        routerLink="/admin"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="!bg-violet-600 !text-white"
        (click)="collapseSidebar()"
        matTooltip="Admin Dashboard"
        matTooltipPosition="right"
        class="flex items-center h-12 rounded-lg
               text-slate-300 hover:bg-slate-800
               hover:text-white transition-colors"
        [class.justify-center]="!sidebarExpanded()"
        [class.gap-3]="sidebarExpanded()"
        [class.px-4]="sidebarExpanded()">

        <mat-icon class="shrink-0">dashboard</mat-icon>

        @if (sidebarExpanded()) {
          <span class="whitespace-nowrap">Dashboard</span>
        }

      </a>

      <!-- Manage Users -->
      <a
        routerLink="/admin/users"
        routerLinkActive="!bg-violet-600 !text-white"
        (click)="collapseSidebar()"
        matTooltip="Manage Users"
        matTooltipPosition="right"
        class="flex items-center h-12 rounded-lg
               text-slate-300 hover:bg-slate-800
               hover:text-white transition-colors"
        [class.justify-center]="!sidebarExpanded()"
        [class.gap-3]="sidebarExpanded()"
        [class.px-4]="sidebarExpanded()">

        <mat-icon class="shrink-0">people</mat-icon>

        @if (sidebarExpanded()) {
          <span class="whitespace-nowrap">Manage Users</span>
        }

      </a>

      <!-- All Applications -->
      <a
        routerLink="/admin/applications"
        routerLinkActive="!bg-violet-600 !text-white"
        (click)="collapseSidebar()"
        matTooltip="All Applications"
        matTooltipPosition="right"
        class="flex items-center h-12 rounded-lg
               text-slate-300 hover:bg-slate-800
               hover:text-white transition-colors"
        [class.justify-center]="!sidebarExpanded()"
        [class.gap-3]="sidebarExpanded()"
        [class.px-4]="sidebarExpanded()">

        <mat-icon class="shrink-0">work</mat-icon>

        @if (sidebarExpanded()) {
          <span class="whitespace-nowrap">All Applications</span>
        }

      </a>

      <!-- Admin Settings -->
      <a
        routerLink="/admin/settings"
        routerLinkActive="!bg-violet-600 !text-white"
        (click)="collapseSidebar()"
        matTooltip="Admin Settings"
        matTooltipPosition="right"
        class="flex items-center h-12 rounded-lg
               text-slate-300 hover:bg-slate-800
               hover:text-white transition-colors"
        [class.justify-center]="!sidebarExpanded()"
        [class.gap-3]="sidebarExpanded()"
        [class.px-4]="sidebarExpanded()">

        <mat-icon class="shrink-0">settings</mat-icon>

        @if (sidebarExpanded()) {
          <span class="whitespace-nowrap">Settings</span>
        }

      </a>

    </nav>

  </aside>

  <!-- Main Content -->
  <main
    class="flex-1
           min-w-0
           h-full
           overflow-y-auto
           bg-slate-50
           p-4
           sm:p-5
           md:p-6">

    <router-outlet></router-outlet>

  </main>

</div>
